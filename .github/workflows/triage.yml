name: triage

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

env:
  TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Smoke test triage entry point
        run: |
          python -c "import sys; sys.path.insert(0, '.github'); from triage import handle_issue; print(handle_issue({}, None))"
