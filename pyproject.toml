[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "triage_bot"
version = "0.1.0"
description = "GitHub Actions bot that auto-triages incoming issues using TypeSafe AI's Jev decision model"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Nathan Roth", email = "nathan1313@gmail.com" }]
dependencies = [
    "requests>=2.28",
]

[project.scripts]
triage_bot = "triage_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
